# Przykładowe nazwy i adresy
[k8s]
cp01.lab.example ansible_host=10.80.50.11 ip=10.80.50.11
cp02.lab.example ansible_host=10.80.50.12 ip=10.80.50.12
cp03.lab.example ansible_host=10.80.50.13 ip=10.80.50.13
wk01.lab.example ansible_host=10.80.50.21 ip=10.80.50.21
wk02.lab.example ansible_host=10.80.50.22 ip=10.80.50.22
wk03.lab.example ansible_host=10.80.50.23 ip=10.80.50.23

[k8s:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/ansible-homelab
ansible_ssh_use_tty=false
automation_source_ip=10.80.70.20

[kube_control_plane]
cp01.lab.example
cp02.lab.example
cp03.lab.example

[etcd:children]
kube_control_plane

[kube_node]
wk01.lab.example
wk02.lab.example
wk03.lab.example

[k8s_cluster:children]
kube_control_plane
kube_node
